name: 🚀 Deploy KODA

on:
  push:
    branches:
      - main      # → koda.build (produção)
      - dev       # → kodabuild.com.br (staging)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.14.4'

jobs:
  # ─────────────────────────────────────────
  # 1. Quality Check
  # ─────────────────────────────────────────
  quality:
    name: 🔍 Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm run typecheck || true   # warn only, não bloqueia deploy

  # ─────────────────────────────────────────
  # 2. Build
  # ─────────────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile --ignore-scripts

      - name: Create .env for build
        run: |
          cat > .env << EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          VITE_APP_URL=${{ github.ref_name == 'main' && 'https://koda.build' || 'https://kodabuild.com.br' }}
          NODE_ENV=production
          PORT=5173
          EOF

      - name: Build
        run: NODE_OPTIONS=--max-old-space-size=4096 pnpm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: koda-build-${{ github.sha }}
          path: |
            build/
            public/
            package.json
            pnpm-lock.yaml
            ecosystem.config.cjs
            bindings.sh
            worker-configuration.d.ts
          retention-days: 7

  # ─────────────────────────────────────────
  # 3. Deploy — Produção (main → koda.build)
  # ─────────────────────────────────────────
  deploy-production:
    name: 🌐 Deploy → koda.build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'main'
    environment:
      name: production
      url: https://koda.build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: koda-build-${{ github.sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/koda_key
          chmod 600 ~/.ssh/koda_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS
        run: |
          # Criar .env.local com todas as vars para o wrangler bindings
          cat > .env.local << EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          VITE_APP_URL=https://koda.build
          NODE_ENV=production
          PORT=5173
          EOF

          # Sincronizar build para a VPS
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/koda_key -o StrictHostKeyChecking=no" \
            build/ public/ package.json pnpm-lock.yaml \
            ecosystem.config.cjs bindings.sh worker-configuration.d.ts .env.local \
            root@${{ secrets.VPS_HOST }}:/opt/koda/

          # Reiniciar app via PM2
          ssh -i ~/.ssh/koda_key -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} << 'SSH'
            cd /opt/koda
            HUSKY=0 pnpm install --frozen-lockfile --ignore-scripts
            pm2 restart koda-prod --update-env
            pm2 save
            echo "✅ Deploy concluído: $(date)"
            curl -sI http://localhost:5173 | head -3
          SSH

      - name: Health check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://koda.build)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check falhou: $STATUS"
            exit 1
          fi
          echo "✅ koda.build está no ar!"

  # ─────────────────────────────────────────
  # 4. Deploy — Staging (dev → kodabuild.com.br)
  # ─────────────────────────────────────────
  deploy-staging:
    name: 🧪 Deploy → kodabuild.com.br
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'dev'
    environment:
      name: staging
      url: https://kodabuild.com.br
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: koda-build-${{ github.sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/koda_key
          chmod 600 ~/.ssh/koda_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS (staging)
        run: |
          cat > .env.local << EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          VITE_APP_URL=https://kodabuild.com.br
          NODE_ENV=production
          PORT=5173
          EOF

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/koda_key -o StrictHostKeyChecking=no" \
            build/ public/ package.json pnpm-lock.yaml \
            ecosystem.config.cjs bindings.sh worker-configuration.d.ts .env.local \
            root@${{ secrets.VPS_HOST }}:/opt/koda/

          ssh -i ~/.ssh/koda_key -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} << 'SSH'
            cd /opt/koda
            HUSKY=0 pnpm install --frozen-lockfile --ignore-scripts
            pm2 restart koda-prod --update-env
            echo "✅ Staging deploy concluído: $(date)"
          SSH

      - name: Health check staging
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://kodabuild.com.br)
          echo "HTTP Status: $STATUS"
          echo "✅ kodabuild.com.br atualizado!"
