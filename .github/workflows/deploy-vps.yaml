name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to koda.build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          timeout: 25m
          script: |
            set -e
            echo "Starting deploy koda.build..."
            if [ -d /opt/koda ]; then
              cd /opt/koda && git pull origin main
            else
              git clone https://github.com/mmpavao/SmartCODE.git /opt/koda && cd /opt/koda
            fi
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > /opt/koda/.env.production
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> /opt/koda/.env.production
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> /opt/koda/.env.production
            echo "VITE_APP_URL=https://koda.build" >> /opt/koda/.env.production
            echo "NODE_ENV=production" >> /opt/koda/.env.production
            echo "PORT=5173" >> /opt/koda/.env.production
            cd /opt/koda
            docker compose down --remove-orphans 2>/dev/null || true
            docker compose build --no-cache app-prod
            docker compose up -d app-prod
            sleep 10
            docker ps
            echo "Deploy done!"
