name: 🚀 Deploy KODA

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.14.4'

jobs:
  quality:
    name: 🔍 Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: HUSKY=0 pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck || true

  deploy-production:
    name: 🌐 Deploy → koda.build
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref_name == 'main'
    environment:
      name: production
      url: https://koda.build
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/koda_key
          chmod 600 ~/.ssh/koda_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via git pull + rebuild
        run: |
          ssh -i ~/.ssh/koda_key -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} << 'SSH'
            set -e
            cd /opt/koda-src

            echo "→ Pulling latest main..."
            git pull origin main

            echo "→ Installing deps..."
            HUSKY=0 pnpm install --frozen-lockfile --ignore-scripts

            echo "→ Building..."
            NODE_OPTIONS=--max-old-space-size=3500 pnpm run build

            echo "→ Restarting PM2..."
            pm2 restart koda-prod --update-env
            pm2 save

            sleep 10
            STATUS=$(curl -sI http://localhost:5173 | head -1)
            echo "Health: $STATUS"
            echo "✅ Deploy koda.build: $(date)"
          SSH

      - name: Health check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://koda.build)
          echo "koda.build HTTP: $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ koda.build no ar!" || (echo "❌ $STATUS" && exit 1)

  deploy-staging:
    name: 🧪 Deploy → kodabuild.com.br
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref_name == 'dev'
    environment:
      name: staging
      url: https://kodabuild.com.br
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/koda_key
          chmod 600 ~/.ssh/koda_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy staging
        run: |
          ssh -i ~/.ssh/koda_key -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} << 'SSH'
            set -e
            cd /opt/koda-src
            git pull origin dev
            HUSKY=0 pnpm install --frozen-lockfile --ignore-scripts
            NODE_OPTIONS=--max-old-space-size=3500 pnpm run build
            pm2 restart koda-prod --update-env
            echo "✅ Staging deploy: $(date)"
          SSH
